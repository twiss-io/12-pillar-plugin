<g opacity="0"><animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0.0;0.01;0.0275;0.2325;0.25;1.0"/><text x="36" y="125" font-size="17" font-weight="600" class="txt mono" >&gt; /12-pillars:setup</text><g opacity="0"><animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0.0;0.05;0.0625;0.2375;0.25;1.0"/><text x="36" y="167" font-size="17" font-weight="600" class="txt" >How do you want to start?</text></g><g opacity="0"><animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0.0;0.07;0.0825;0.2375;0.25;1.0"/><rect x="36" y="195" width="560" height="42" rx="8" class="panel" stroke-width="1.5"/><text x="56" y="222" font-size="16" font-weight="600" class="txt" >Full setup</text><text x="190" y="222" font-size="14" font-weight="400" class="mut" >~30–40 min: who you are, your days, one pillar</text></g><g opacity="0"><animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0.0;0.09;0.1025;0.2375;0.25;1.0"/><rect x="36" y="247" width="560" height="42" rx="8" class="panel" stroke-width="1.5"/><text x="56" y="274" font-size="16" font-weight="600" class="txt" >Quick start</text><text x="190" y="274" font-size="14" font-weight="400" class="mut" >~5 min: who you are and your days, learn the rest</text><rect x="36" y="247" width="560" height="42" rx="8" fill="none" stroke="#E8833A" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0.0;0.16;0.17;0.24;0.25;1.0"/></rect></g></g>
<g opacity="0"><animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0.0;0.25;0.2675;0.4575;0.475;1.0"/><g opacity="0"><animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0.0;0.26;0.2725;0.4625;0.475;1.0"/><text x="36" y="125" font-size="17" font-weight="600" class="txt" >Who are you, in a sentence or two?</text></g><g opacity="0"><animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0.0;0.29;0.3025;0.4625;0.475;1.0"/><text x="56" y="157" font-size="15" font-weight="400" class="mut mono" >&gt; Final-year student, tech lead, building a brand.</text></g><g opacity="0"><animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0.0;0.34;0.3525;0.4625;0.475;1.0"/><text x="36" y="225" font-size="17" font-weight="600" class="txt" >Where do you want to be in 3–5 years?</text></g><g opacity="0"><animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0.0;0.37;0.3825;0.4625;0.475;1.0"/><text x="56" y="257" font-size="15" font-weight="400" class="mut mono" >&gt; Leading engineering, my own studio on the side.</text></g><g opacity="0"><animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0.0;0.42;0.4325;0.4625;0.475;1.0"/><rect x="36" y="321" width="520" height="38" rx="8" fill="#E8833A"/><text x="56" y="346" font-size="15" font-weight="700" class="txt" style="fill:#fff">✓ 02-identity: north star written, running</text></g></g>
<g opacity="0"><animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0.0;0.475;0.4925;0.7075;0.725;1.0"/><text x="36" y="125" font-size="17" font-weight="600" class="txt" >Studies, a job + a side shop? Here's the plan:</text><g opacity="0"><animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0.0;0.5;0.5125;0.7125;0.725;1.0"/><text x="56" y="165" font-size="16" font-weight="400" class="txt mono" >01 … 12</text><text x="380" y="165" font-size="14" font-weight="400" class="mut" >← your 12 pillars, the whole brain</text></g><g opacity="0"><animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0.0;0.5225;0.535;0.7125;0.725;1.0"/><text x="56" y="201" font-size="16" font-weight="400" class="txt mono" >05-development/nus/</text><text x="380" y="201" font-size="14" font-weight="400" class="mut" >← your studies</text></g><g opacity="0"><animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0.0;0.545;0.5575;0.7125;0.725;1.0"/><text x="56" y="237" font-size="16" font-weight="400" class="txt mono" >07-career/twiss/</text><text x="380" y="237" font-size="14" font-weight="400" class="mut" >← your job · clients, projects</text></g><g opacity="0"><animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0.0;0.5675;0.58;0.7125;0.725;1.0"/><text x="56" y="273" font-size="16" font-weight="400" class="txt mono" >09-opportunities/side-shop/</text><text x="380" y="273" font-size="14" font-weight="400" class="mut" >← a business you run</text></g><g opacity="0"><animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0.0;0.59;0.6025;0.7125;0.725;1.0"/><text x="56" y="309" font-size="16" font-weight="400" class="txt mono" >raw/  actions.md</text><text x="380" y="309" font-size="14" font-weight="400" class="mut" >← sources · every deadline</text></g><g opacity="0"><animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0.0;0.63;0.6425;0.7125;0.725;1.0"/><rect x="36" y="353" width="200" height="38" rx="8" fill="#E8833A"/><text x="56" y="378" font-size="16" font-weight="700" class="txt" style="fill:#fff">✓ Create it</text></g></g>
<g opacity="0"><animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0.0;0.725;0.7425;0.9725;0.99;1.0"/><text x="36" y="125" font-size="17" font-weight="600" class="txt mono" >&gt; help me reply to this client email</text><text x="36" y="155" font-size="15" font-weight="400" class="mut mono" >(keep it short, exams until Dec 4 and I quit coffee lol)</text><g opacity="0"><animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0.0;0.8;0.8125;0.9775;0.99;1.0"/><rect x="36" y="185" width="700" height="132" rx="10" class="panel" stroke-width="1.5"/><text x="56" y="215" font-size="16" font-weight="600" class="txt" >Done. I also picked up 2 things about you:</text><text x="70" y="245" font-size="15" font-weight="400" class="txt" >• Exam season until Dec 4  → 02-identity/now.md, Time</text><text x="70" y="273" font-size="15" font-weight="400" class="txt" >• Quit coffee  → Health pillar</text><text x="56" y="303" font-size="15" font-weight="400" class="mut" >File them?  [yes]</text></g><g opacity="0"><animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0.0;0.88;0.8925;0.9775;0.99;1.0"/><rect x="36" y="335" width="420" height="38" rx="8" fill="#E8833A"/><text x="56" y="360" font-size="15" font-weight="700" class="txt" style="fill:#fff">✓ Filed. Your pillars keep filling in.</text></g></g>
