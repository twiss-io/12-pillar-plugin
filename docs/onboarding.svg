<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" aria-label="Setup walkthrough: choose full or quick start; tell it who you are; your job, studies and business go inside their pillars; then the AI learns as you go">

<style>
  .txt { fill: #1f2328; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
